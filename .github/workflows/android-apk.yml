name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional GitHub release tag to attach the APK to
        required: false
        type: string
  push:
    branches:
      - arena/01a095a4-allinone

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Build debug APK
        id: gradle_build
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew app:assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Summarize Gradle failure
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          log_path = Path('gradle-build.log')
          text = log_path.read_text(errors='ignore') if log_path.exists() else 'No gradle-build.log found.'
          markers = ['* What went wrong:', 'Caused by:', 'FAILURE: Build failed with an exception.']
          start = 0
          for marker in markers:
            idx = text.rfind(marker)
            if idx != -1:
              start = idx
              break
          snippet = text[start:]
          lines = snippet.strip().splitlines()[-80:]
          message = ' | '.join(line.strip().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A') for line in lines)
          print(f'::error::{message[:6000]}')
          PY

      - name: Prepare APK filename
        if: success()
        id: apk
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_NAME="college-timetable-debug-${GITHUB_SHA::7}.apk"
          cp "$APK_PATH" "$APK_NAME"
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Upload workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Attach APK to GitHub release
        if: ${{ success() && github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH#$APK_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH#$APK_NAME" --title "$RELEASE_TAG" --notes "Installable Android debug APK build."
          fi
